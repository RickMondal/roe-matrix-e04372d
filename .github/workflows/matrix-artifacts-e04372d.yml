name: Matrix Build Artifacts (e04372d)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: matrix-e04372d
        run: echo "Building for Python ${{ matrix.python-version }} on OS ${{ matrix.os }}"

      - name: Generate build artifact
        shell: bash
        run: |
          mkdir -p ROE/builds
          OUT="ROE/builds/output-${{ matrix.os }}-py${{ matrix.python-version }}.txt"
          echo "Variant: OS=${{ matrix.os }} PY=${{ matrix.python-version }}" > "$OUT"
          echo "Kernel: $(uname -s) Arch: $(uname -m)" >> "$OUT" || true
          python --version >> "$OUT"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT"
          echo "Random check: $RANDOM" >> "$OUT"
          test -s "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-e04372d-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ROE/builds/output-${{ matrix.os }}-py${{ matrix.python-version }}.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
